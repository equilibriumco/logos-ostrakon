# The same guest with approval verification on our own GLV + wNAF loop over the
# secp256k1 EC circuits, instead of the patched `k256`.
#
# The patch tags differ from the sibling guests': the backend pins the versions
# its cost was measured against, and an exact pin cannot be satisfied by a
# patch at another version.
[workspace]

[package]
name = "ostrakon-guest-plumbing"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ostrakon_plumbing"
path = "src/bin/ostrakon_plumbing.rs"

[dependencies]
ostrakon-core = { path = "../../core", features = ["fast", "plumbing"] }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "9f004c6b90142b3de450c64e655cf699724b3e6f" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.3-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.2-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
