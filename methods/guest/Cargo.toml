# Its own workspace: it cross-compiles to riscv32im-risc0-zkvm-elf and needs a
# [patch.crates-io] the host side must not see.
[workspace]

[package]
name = "ostrakon-guest"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ostrakon"
path = "src/bin/ostrakon.rs"

[dependencies]
ostrakon-core = { path = "../../core" }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", rev = "9f004c6b90142b3de450c64e655cf699724b3e6f" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# RISC Zero's accelerated forks. BIP-340 verification goes through the zkVM's
# bigint2 curve arithmetic instead of software field arithmetic. Without these
# one verification costs millions of cycles and no M fits a transaction.
[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
